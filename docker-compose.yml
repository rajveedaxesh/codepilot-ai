version: '3.8'

services:
  codepilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codepilot-ai
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LLM_PROVIDER=mock
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=claude-3-5-sonnet-20241022
      - EXECUTION_TIMEOUT_SECONDS=30
    volumes:
      - codepilot_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codepilot_data:
